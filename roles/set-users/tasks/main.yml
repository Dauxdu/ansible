---
- name: Ensure sudo package is installed
  ansible.builtin.apt:
    name: sudo
    state: present
    cache_valid_time: 3600

- name: Create sudo user groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ sudo_user_groups | default([]) }}"

- name: Create deploy user groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ deploy_user_groups | default([]) }}"

- name: Create sudo users
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: present
    groups: "{{ sudo_user_groups | join(',') }}"
    append: true
    shell: /bin/bash
    create_home: true
    password_lock: false
  loop: "{{ sudo_users | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create deploy users
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: present
    groups: "{{ deploy_user_groups | join(',') }}"
    append: true
    shell: /bin/bash
    create_home: true
    password_lock: true
  loop: "{{ deploy_users | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Configure sudo access for admin users
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  loop: "{{ sudo_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: sudo_users | length > 0

- name: Configure restricted sudo for deploy users
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item.name }}"
    content: |
      {{ item.name }} ALL=(ALL) NOPASSWD: /usr/bin/systemctl, /usr/bin/docker stack *, /usr/bin/docker service *, /usr/bin/docker ps *
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  loop: "{{ deploy_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: deploy_users | length > 0

- name: Manage SSH authorized keys for sudo users
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ item.ssh_public_key }}"
    exclusive: false
  loop: "{{ sudo_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: sudo_users | length > 0

- name: Manage SSH authorized keys for deploy users
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ item.ssh_public_key }}"
    exclusive: false
  loop: "{{ deploy_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: deploy_users | length > 0
