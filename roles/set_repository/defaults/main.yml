# Список репозиториев; поля со значениями по умолчанию можно опускать.
#
#   name        (обязательно) имя = файл /etc/apt/sources.list.d/<name>.sources
#   uris        (обязательно) URI репозитория
#   suites      (обязательно) suites (дистрибутивы); для flat-репозитория — [/]
#   types         default deb (deb, deb-src)
#   components    default не задаётся (для flat-репозиториев)
#   signed_by     GPG-ключ: URL, путь к keyring-файлу или ключ текстом
#   enabled       default true
#   state         default present (absent — удалить репозиторий)
set_repository_repos: []
