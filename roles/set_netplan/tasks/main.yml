---
- name: Disable cloud-init network management
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: |
      network:
        config: disabled
    owner: root
    group: root
    mode: "0644"

- name: Remove cloud-init generated netplan configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/netplan/00-installer-config.yaml
    - /etc/netplan/00-installer-config.yml
    - /etc/netplan/50-cloud-init.yaml
    - /etc/netplan/50-cloud-init.yml

- name: Copy netplan configuration
  ansible.builtin.template:
    src: 01-netcfg.yaml.j2
    dest: "/etc/netplan/{{ set_netplan_config_file }}"
    owner: root
    group: root
    mode: "0600"
  notify:
    - Validate netplan configuration
    - Apply netplan configuration
