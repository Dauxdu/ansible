---
# Конфигурация сети одним словарём:
#   interface    имя интерфейса
#   dhcp         DHCP-клиент (true) или статика (false)
#   address      IP-адрес (обязателен при dhcp: false)
#   prefix       CIDR-префикс подсети (24 = /24)
#   gateway      шлюз (обязателен при dhcp: false)
#   dns_servers  список DNS-серверов
set_netplan_config:
  interface: eth0
  dhcp: true
  address: ""
  prefix: 24
  gateway: ""
  dns_servers: []

set_netplan_config_file: "01-netcfg.yaml"
