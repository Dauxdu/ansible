---
set_docker_sudo: []
set_docker_deploy: []

set_docker_arch_map:
  x86_64: amd64
  aarch64: arm64

set_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Docker registry authentication
set_docker_registries: []
set_docker_username: ""
set_docker_password: ""

# Docker daemon configuration
set_docker_log_driver: "json-file"
set_docker_log_max_size: "100m"
set_docker_log_max_file: "5"
set_docker_storage_driver: "overlay2"

# Default address pools для Swarm overlay сетей
set_docker_default_address_pools:
  - base: "172.30.0.0/16"
    size: 24
  - base: "172.31.0.0/16"
    size: 24
