---
# Обязательные переменные (передаются через vars):
#   deploy_docker_stack_name          имя stack
#   deploy_docker_stack_compose_src   путь к compose-файлу
#   deploy_docker_stack_compose_dst  путь, куда файл будет загружен
deploy_docker_stack_compose_mode: "0640"
deploy_docker_stack_prune: true
