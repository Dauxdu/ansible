---
- name: "Deploy Docker stack '{{ deploy_docker_stack_name }}'"
  ansible.builtin.command:
    cmd: >-
      docker stack deploy
      -c {{ deploy_docker_stack_compose_path }}
      {% if deploy_docker_stack_prune %}--prune{% endif %}
      --with-registry-auth
      {{ deploy_docker_stack_name }}
  register: deploy_docker_stack_result
  changed_when: >-
    'Creating service' in deploy_docker_stack_result.stdout
    or 'Updating service' in deploy_docker_stack_result.stdout
  delegate_to: "{{ groups['swarm_managers'] | first }}"
  run_once: true

- name: "Display deploy result for '{{ deploy_docker_stack_name }}'"
  ansible.builtin.debug:
    var: deploy_docker_stack_result.stdout_lines
  delegate_to: "{{ groups['swarm_managers'] | first }}"
  run_once: true
  when: deploy_docker_stack_result.stdout_lines is defined
