---
- name: "Upload compose file for '{{ deploy_docker_stack_name }}'"
  ansible.builtin.copy:
    src: "{{ deploy_docker_stack_compose_src }}"
    dest: "{{ deploy_docker_stack_compose_dst }}"
    owner: root
    group: root
    mode: "{{ deploy_docker_stack_compose_mode }}"
    validate: docker stack config --compose-file %s
  delegate_to: "{{ groups['swarm_managers'] | first }}"
  run_once: true
