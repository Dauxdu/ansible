---
set_motd_show:
  hostname: true
  ip: true
  os: true
  kernel: true
  uptime: true
  cpu: true
  memory: true
  disk: true
  load: true
  failed_units: true
  disk_warning: true

set_motd_disk_warning_threshold: 80

set_motd_remove_scripts:
  - /etc/update-motd.d/00-header
  - /etc/update-motd.d/10-help-text
  - /etc/update-motd.d/50-motd-news
  - /etc/update-motd.d/91-release-upgrade
