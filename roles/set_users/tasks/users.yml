---
- name: Ensure sudo package is installed
  ansible.builtin.apt:
    name: sudo
    state: present
    cache_valid_time: 3600

- name: Create user groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ set_users_accounts | selectattr('groups', 'defined') | map(attribute='groups') | flatten | unique }}"

- name: Create users
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: present
    groups: "{{ user.groups | join(',') if user.groups else omit }}"
    append: true
    shell: "{{ user.shell }}"
    create_home: "{{ user.create_home }}"
    password_lock: "{{ user.password_lock }}"
    comment: "{{ user.comment | default(omit) }}"
    uid: "{{ user.uid | default(omit) }}"
  vars:
    user: "{{ set_users_account_defaults | combine(item) }}"
  loop: "{{ set_users_accounts }}"
  loop_control:
    label: "{{ item.name }}"
