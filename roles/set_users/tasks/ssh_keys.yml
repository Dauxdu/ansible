---
- name: Manage SSH authorized keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ item.ssh_public_key }}"
    exclusive: true
  loop: "{{ set_users_accounts | selectattr('ssh_public_key', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
