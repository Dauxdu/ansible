---
- name: Get Swarm worker token
  ansible.builtin.command:
    cmd: docker swarm join-token -q worker
  register: set_docker_swarm_worker_token_result
  changed_when: false
  no_log: true
  when: inventory_hostname == groups['swarm_managers'] | first

- name: Get Swarm manager token
  ansible.builtin.command:
    cmd: docker swarm join-token -q manager
  register: set_docker_swarm_manager_token_result
  changed_when: false
  no_log: true
  when: inventory_hostname == groups['swarm_managers'] | first

- name: Set Swarm tokens as facts for all hosts
  vars:
    swarm_primary: "{{ groups['swarm_managers'] | first }}"
  ansible.builtin.set_fact:
    set_docker_swarm_worker_token: >-
      {{ hostvars[swarm_primary].set_docker_swarm_worker_token_result.stdout | default('') | trim }}
    set_docker_swarm_manager_token: >-
      {{ hostvars[swarm_primary].set_docker_swarm_manager_token_result.stdout | default('') | trim }}
    set_docker_swarm_advertise_addr: "{{ hostvars[swarm_primary].ip_address }}"
  no_log: true
  when:
    - hostvars[groups['swarm_managers'] | first].set_docker_swarm_worker_token_result is defined
