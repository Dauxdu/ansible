---
- name: Get Swarm worker token
  ansible.builtin.command:
    cmd: docker swarm join-token -q worker
  register: set_docker_swarm_worker_token_result
  changed_when: false
  no_log: true
  when: inventory_hostname == set_docker_swarm_primary

- name: Get Swarm manager token
  ansible.builtin.command:
    cmd: docker swarm join-token -q manager
  register: set_docker_swarm_manager_token_result
  changed_when: false
  no_log: true
  when: inventory_hostname == set_docker_swarm_primary

- name: Set Swarm tokens as facts for all hosts
  ansible.builtin.set_fact:
    set_docker_swarm_worker_token: >-
      {{ hostvars[set_docker_swarm_primary].set_docker_swarm_worker_token_result.stdout | default('') | trim }}
    set_docker_swarm_manager_token: >-
      {{ hostvars[set_docker_swarm_primary].set_docker_swarm_manager_token_result.stdout | default('') | trim }}
  no_log: true
  when:
    - hostvars[set_docker_swarm_primary].set_docker_swarm_worker_token_result is defined
