---
# ======================
# FIREWALL
# ======================

- name: Deploy Docker Swarm firewall rules
  ansible.builtin.template:
    src: swarm.nft.j2
    dest: /etc/nftables.d/swarm.nft
    owner: root
    group: root
    mode: "0644"
  notify: Reload nftables

- name: Flush handlers to apply firewall rules immediately
  ansible.builtin.meta: flush_handlers

# ======================
# SWARM INITIALIZATION
# ======================

- name: Check Swarm status on primary manager
  ansible.builtin.command:
    cmd: docker info --format '{{ "{{ .Swarm.LocalNodeState }}" }}'
  register: swarm_status_primary
  changed_when: false
  failed_when: false
  when: inventory_hostname == groups['swarm_managers'][0]

- name: Initialize Docker Swarm on primary manager
  ansible.builtin.command:
    cmd: docker swarm init --advertise-addr {{ ip_address }}
  when:
    - inventory_hostname == groups['swarm_managers'][0]
    - swarm_status_primary.stdout is defined
    - swarm_status_primary.stdout | trim == "inactive"
  register: swarm_init_result

- name: Wait for Swarm API to be ready after initialization
  ansible.builtin.command:
    cmd: docker info --format '{{ "{{ .Swarm.LocalNodeState }}" }}'
  register: swarm_wait
  until: swarm_wait.stdout | trim == "active"
  retries: 10
  delay: 3
  changed_when: false
  when:
    - inventory_hostname == groups['swarm_managers'][0]
    - swarm_init_result is defined
    - swarm_init_result.changed

# ======================
# GET TOKENS
# ======================

- name: Get Swarm worker token
  ansible.builtin.command:
    cmd: docker swarm join-token -q worker
  register: swarm_worker_token_result
  changed_when: false
  when: inventory_hostname == groups['swarm_managers'][0]
  no_log: true

- name: Get Swarm manager token
  ansible.builtin.command:
    cmd: docker swarm join-token -q manager
  register: swarm_manager_token_result
  changed_when: false
  when: inventory_hostname == groups['swarm_managers'][0]
  no_log: true

# ======================
# PROPAGATE TOKENS TO ALL HOSTS
# ======================

# roles/set-docker-swarm/tasks/main.yml
- name: Set Swarm tokens as facts for all hosts
  vars:
    swarm_primary: "{{ groups['swarm_managers'] | first }}"
    swarm_primary_worker_token: "{{ hostvars[swarm_primary].swarm_worker_token_result.stdout | default('') | trim }}"
    swarm_primary_manager_token: "{{ hostvars[swarm_primary].swarm_manager_token_result.stdout | default('') | trim }}"
  ansible.builtin.set_fact:
    swarm_worker_token: "{{ swarm_primary_worker_token }}"
    swarm_manager_token: "{{ swarm_primary_manager_token }}"
    swarm_advertise_addr: "{{ hostvars[swarm_primary].ip_address }}"
  when:
    - swarm_primary_worker_token | length > 0
    - swarm_primary_manager_token | length > 0
  no_log: true

# ======================
# CHECK SWARM STATUS ON ALL NODES
# ======================

- name: Check Swarm status on all nodes
  ansible.builtin.command:
    cmd: docker info --format '{{ "{{ .Swarm.LocalNodeState }}" }}'
  register: swarm_status
  changed_when: false
  failed_when: false

# ======================
# JOIN SECONDARY MANAGERS
# ======================

- name: Join secondary managers to Swarm
  ansible.builtin.command:
    cmd: docker swarm join --token {{ swarm_manager_token }} {{ swarm_advertise_addr }}:2377
  when:
    - inventory_hostname in groups['swarm_managers']
    - inventory_hostname != groups['swarm_managers'][0]
    - swarm_status.stdout is defined
    - swarm_status.stdout | trim == "inactive"
    - swarm_manager_token is defined

# ======================
# JOIN WORKERS
# ======================

- name: Join workers to Swarm
  ansible.builtin.command:
    cmd: docker swarm join --token {{ swarm_worker_token }} {{ swarm_advertise_addr }}:2377
  when:
    - inventory_hostname in groups['swarm_workers']
    - swarm_status.stdout is defined
    - swarm_status.stdout | trim == "inactive"
    - swarm_worker_token is defined
