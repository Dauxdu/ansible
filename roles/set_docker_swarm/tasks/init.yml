---
- name: Check Swarm status on primary manager
  ansible.builtin.command:
    cmd: docker info --format '{{ "{{ .Swarm.LocalNodeState }}" }}'
  register: set_docker_swarm_status_primary
  changed_when: false
  failed_when: false
  when: inventory_hostname == groups['swarm_managers'] | first

- name: Initialize Docker Swarm on primary manager
  ansible.builtin.command:
    cmd: docker swarm init --advertise-addr {{ ip_address }}
  when:
    - inventory_hostname == groups['swarm_managers'] | first
    - set_docker_swarm_status_primary.stdout | default('') | trim == "inactive"
  changed_when: true

- name: Wait for Swarm API to be ready
  ansible.builtin.command:
    cmd: docker info --format '{{ "{{ .Swarm.LocalNodeState }}" }}'
  register: set_docker_swarm_wait
  until: set_docker_swarm_wait.stdout | trim == "active"
  retries: 10
  delay: 3
  changed_when: false
  when:
    - inventory_hostname == groups['swarm_managers'] | first
