---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ hostname }}"
    use: systemd
  when: ansible_facts.hostname != hostname
  register: hostname_result

- name: Ensure /etc/hosts has localhost hostname mapping
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ hostname }}"
    state: present

- name: Ensure hostname is in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ ip_address }}"
    line: "{{ ip_address }} {{ hostname }}"
    state: present
  when: ip_address is defined
