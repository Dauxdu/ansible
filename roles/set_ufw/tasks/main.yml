---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: "Default policy: deny incoming"
  community.general.ufw:
    direction: incoming
    policy: deny

- name: "Default policy: allow outgoing"
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('any') }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ set_ufw_rules_allow | default([]) }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled
    logging: "{{ set_ufw_rules_logging }}"
