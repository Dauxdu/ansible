---
- name: Disable systemd-timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: stopped
    enabled: false

- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    cache_valid_time: 3600
  notify: Restart chrony

- name: Ensure chrony loads sources.d directory
  ansible.builtin.lineinfile:
    path: "{{ set_chrony_main_config_path }}"
    regexp: '^#?\s*sourcedir\s+/etc/chrony/sources\.d'
    line: sourcedir /etc/chrony/sources.d
    state: present
    backup: true
  notify: Restart chrony

- name: Configure chrony NTP sources
  ansible.builtin.template:
    src: ansible.sources.j2
    dest: "{{ set_chrony_sources_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Ensure chrony is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ set_chrony_service_name }}"
    enabled: true
    state: started
