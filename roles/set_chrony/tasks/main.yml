---
- name: Check if systemd-timesyncd unit exists
  ansible.builtin.stat:
    path: /lib/systemd/system/systemd-timesyncd.service
  register: set_chrony_timesyncd_unit

- name: Disable systemd-timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: stopped
    enabled: false
  when: set_chrony_timesyncd_unit.stat.exists

- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    cache_valid_time: 3600
  notify: Restart chrony

- name: Configure chrony NTP sources
  ansible.builtin.template:
    src: ansible.sources.j2
    dest: "{{ set_chrony_sources_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Ensure chrony is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ set_chrony_service_name }}"
    enabled: true
    state: started
