---
- name: Disable systemd-timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: stopped
    enabled: false

- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
  notify: Restart chrony

- name: Configure chrony NTP sources
  ansible.builtin.template:
    src: ansible.sources.j2
    dest: "{{ set_chrony_sources_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Ensure chrony is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ set_chrony_service_name }}"
    enabled: true
    state: started
