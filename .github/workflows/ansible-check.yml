name: Ansible Lint

on:
  push:
    branches: [main]
    paths:
      - "roles/**"
      - ".ansible-lint"
      - ".yamllint"
      - "requirements-lint.txt"
      - ".github/workflows/ansible-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "roles/**"
      - ".ansible-lint"
      - ".yamllint"
      - "requirements-lint.txt"
      - ".github/workflows/ansible-check.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ansible-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  lint:
    name: Ansible lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lint.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-lint.txt

      - name: Check YAML syntax with yamllint
        id: yamllint
        continue-on-error: true
        run: yamllint --format parsable .

      - name: Run ansible-lint
        id: ansible_lint
        continue-on-error: true
        run: ansible-lint
